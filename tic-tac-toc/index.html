<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Tic-Tac-Toe</h1>
        <div class = "msg-container hide">
            <p id="msg">Winner</p>
            <button id="new-btn">New Game</button>
        </div>
        <div class="container">
            <div class="game">
                <button class="box" title="box 1"></button>
                <button class="box" title="box 2"></button>
                <button class="box" title="box 3"></button>
                <button class="box" title="box 4"></button>
                <button class="box" title="box 5"></button>
                <button class="box" title="box 6"></button>
                <button class="box" title="box 7"></button>
                <button class="box" title="box 8"></button>
                <button class="box" title="box 9"></button>
            </div>
        </div>
        <button id="reset-btn">Reset Game</button>
    </main>
    <script src="script.js"></script>
</body>

</html>
